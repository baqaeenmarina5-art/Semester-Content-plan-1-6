<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Curriculum Planning Toolkit — Grades 1–6</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e2033">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Curriculum Toolkit">
<style>
  :root{
    --navy:#1c3a5e;
    --navy-deep:#12283f;
    --slate:#3f5872;
    --paper:#f7f5f0;
    --card:#ffffff;
    --line:#d9d3c4;
    --accent:#b5651d;
    --accent-soft:#f1e3d3;
    --ink:#20242a;
    --muted:#6b7280;
    --good:#2f6d4f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: "Iowan Old Style","Palatino Linotype", Georgia, serif;
    background:var(--paper);
    color:var(--ink);
  }
  .topbar{
    background:var(--navy-deep);
    color:#f2ede2;
    padding:20px 28px 0;
    border-bottom:4px solid var(--accent);
  }
  .topbar h1{
    margin:0 0 4px;
    font-size:1.5rem;
    font-weight:600;
    letter-spacing:.01em;
  }
  .topbar p.sub{
    margin:0 0 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size:.85rem;
    color:#c9d2de;
  }
  .modes{
    display:flex;
    gap:4px;
  }
  .modes button{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size:.88rem;
    font-weight:600;
    padding:10px 20px;
    background:transparent;
    border:none;
    color:#b7c2d1;
    cursor:pointer;
    border-bottom:3px solid transparent;
  }
  .modes button.active{
    color:#fff;
    border-bottom:3px solid var(--accent);
    background:rgba(255,255,255,.05);
  }
  .layout{
    display:flex;
    min-height:calc(100vh - 100px);
  }
  nav.grades{
    width:150px;
    flex:0 0 150px;
    background:var(--navy);
    padding:18px 0;
  }
  nav.grades button{
    display:block;
    width:100%;
    text-align:left;
    padding:12px 20px;
    background:none;
    border:none;
    border-left:4px solid transparent;
    color:#dbe4f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size:.92rem;
    cursor:pointer;
    transition:background .15s;
  }
  nav.grades button:hover{ background:rgba(255,255,255,.08); }
  nav.grades button.active{
    background:var(--paper);
    color:var(--navy-deep);
    font-weight:700;
    border-left:4px solid var(--accent);
  }
  main{
    flex:1;
    padding:26px 34px 60px;
    max-width:1220px;
  }
  .grade-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
    margin-bottom:18px;
    padding-bottom:14px;
    border-bottom:2px solid var(--line);
  }
  .grade-fields{
    display:flex;
    gap:22px;
    flex-wrap:wrap;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .field label{
    font-size:.68rem;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--muted);
  }
  .field input{
    font-family: inherit;
    font-size:.95rem;
    border:1px solid var(--line);
    border-radius:4px;
    padding:6px 8px;
    background:var(--card);
    color:var(--ink);
    min-width:140px;
  }
  .field input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  button.btn{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size:.83rem;
    font-weight:600;
    padding:9px 14px;
    border-radius:5px;
    border:1px solid var(--navy);
    background:var(--navy);
    color:#fff;
    cursor:pointer;
  }
  button.btn.secondary{ background:var(--card); color:var(--navy); }
  button.btn.ghost{ background:transparent; color:var(--slate); border-color:var(--line); }
  button.btn:hover{ opacity:.88; }

  .unit-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    margin-bottom:22px;
    overflow:hidden;
  }
  .unit-bar{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    background:var(--accent-soft);
    padding:10px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }
  .unit-bar .tag{
    font-weight:700;
    color:var(--accent);
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.05em;
  }
  .unit-bar input.title{
    flex:1 1 220px;
    font-family: inherit;
    font-size:.95rem;
    font-weight:600;
    border:1px solid transparent;
    background:transparent;
    padding:5px 6px;
    border-radius:4px;
    color:var(--ink);
  }
  .unit-bar input.title:focus{ background:#fff; border-color:var(--line); outline:none; }
  .unit-bar input.meta{
    width:132px;
    font-family: inherit;
    font-size:.78rem;
    border:1px solid var(--line);
    background:#fff;
    padding:5px 7px;
    border-radius:4px;
    color:var(--slate);
  }
  .unit-bar button.remove{
    background:none;
    border:none;
    color:#a44;
    cursor:pointer;
    font-size:.78rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }
  table.analysis{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
  }
  table.analysis th{
    background:#eef1f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size:.72rem;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--slate);
    text-align:left;
    padding:8px 10px;
    border:1px solid var(--line);
  }
  table.analysis td{
    border:1px solid var(--line);
    vertical-align:top;
    padding:0;
  }
  table.analysis textarea{
    width:100%;
    min-height:100px;
    border:none;
    resize:vertical;
    padding:9px 10px;
    font-family: "Iowan Old Style", Georgia, serif;
    font-size:.87rem;
    line-height:1.4;
    color:var(--ink);
    background:transparent;
  }
  table.analysis textarea:focus{ outline:2px solid var(--accent); outline-offset:-2px; background:#fffdf8; }

  .tp-table-wrap{ overflow-x:auto; }
  table.tp-table{ min-width:1100px; table-layout:fixed; }
  table.tp-table th:nth-child(1), table.tp-table td:nth-child(1){ width:6%; }
  table.tp-table th:nth-child(2), table.tp-table td:nth-child(2){ width:21%; }
  table.tp-table th:nth-child(3), table.tp-table td:nth-child(3){ width:13%; }
  table.tp-table th:nth-child(4), table.tp-table td:nth-child(4){ width:13%; }
  table.tp-table th:nth-child(5), table.tp-table td:nth-child(5),
  table.tp-table th:nth-child(6), table.tp-table td:nth-child(6){ width:8%; }
  table.tp-table th:nth-child(7), table.tp-table td:nth-child(7){ width:13%; }
  table.tp-table th:nth-child(8), table.tp-table td:nth-child(8){ width:12%; }
  td.tp-subhead{
    background:#eef1f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size:.72rem;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--slate);
    text-align:center;
    padding:6px 4px;
    vertical-align:middle;
  }

  .toolbar-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:6px;
    flex-wrap:wrap;
    gap:10px;
  }
  .hint{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size:.78rem;
    color:var(--muted);
  }
  .toast{
    position:fixed;
    bottom:22px;
    right:22px;
    background:var(--good);
    color:#fff;
    padding:10px 16px;
    border-radius:6px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size:.85rem;
    box-shadow:0 4px 14px rgba(0,0,0,.2);
    opacity:0;
    transform:translateY(8px);
    transition:opacity .2s, transform .2s;
    pointer-events:none;
    z-index:50;
  }
  .toast.show{ opacity:1; transform:translateY(0); }
  @media (max-width:760px){
    .layout{ flex-direction:column; }
    nav.grades{ width:100%; flex:none; display:flex; overflow-x:auto; padding:8px; }
    nav.grades button{ border-left:none; border-bottom:3px solid transparent; white-space:nowrap; }
    nav.grades button.active{ border-bottom-color:var(--accent); }
    main{ padding:18px; }
    table.tp-table{ min-width:900px; }
  }
</style>
</head>

<div class="topbar">
  <h1>Curriculum Planning Toolkit</h1>

    <div class="toolbar-bottom">

      <div class="actions">

        <button class="btn secondary" id="downloadAllBtn">Download all 6 grades (.doc)</button>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

let mode = "ca"; // "ca" | "tp"
let state = {
  ca: JSON.parse(JSON.stringify(ORIGINAL_DATA_CA)),
  tp: JSON.parse(JSON.stringify(ORIGINAL_DATA_TP))
};
let activeGrade = { ca:0, tp:0 };

const modeNav = document.getElementById("modeNav");
const gradeNav = document.getElementById("gradeNav");
const gradeFields = document.getElementById("gradeFields");
const unitsContainer = document.getElementById("unitsContainer");
const hintText = document.getElementById("hintText");

function escAttr(s){
  return String(s || "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
}
function escHtml(s){
  return String(s || "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\n/g,"<br>");
}
function autosize(ta){
  ta.style.height = "auto";
  ta.style.height = Math.max(80, ta.scrollHeight + 2) + "px";
}

function renderModeNav(){
  modeNav.innerHTML = "";
  [["ca","Content Analysis"], ["tp","Term Plan"]].forEach(([key, label]) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.className = mode === key ? "active" : "";
    b.onclick = () => { mode = key; renderAll(); };
    modeNav.appendChild(b);
  });
}

function renderNav(){
  gradeNav.innerHTML = "";
  state[mode].forEach((g, i) => {
    const b = document.createElement("button");
    b.textContent = g.level.replace(/(st|nd|rd|th)\s*Grade/i, "$&").replace(/^([0-9]+)(st|nd|rd|th).*/i, "$1$2 grade");
    b.className = i === activeGrade[mode] ? "active" : "";
    b.onclick = () => { activeGrade[mode] = i; renderAll(); };
    gradeNav.appendChild(b);
  });
}

function renderGradeFields(){
  const g = state[mode][activeGrade[mode]];
  gradeFields.innerHTML = `
    <div class="field"><label>Subject</label><input data-bind="subject" value="${escAttr(g.subject)}"></div>
    <div class="field"><label>Class / Level</label><input data-bind="level" value="${escAttr(g.level)}"></div>
    <div class="field"><label>Semester</label><input data-bind="semester" value="${escAttr(g.semester)}"></div>
  `;
  gradeFields.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("input", () => {
      g[inp.dataset.bind] = inp.value;
      if(inp.dataset.bind === "level") renderNav();
    });
  });
}

/* ---------- Content Analysis unit rendering ---------- */
function renderUnitsCA(g){
  unitsContainer.innerHTML = "";
  g.units.forEach((u, ui) => {
    const card = document.createElement("div");
    card.className = "unit-card";

    const bar = document.createElement("div");
    bar.className = "unit-bar";
    bar.innerHTML = `
      <span class="tag">Unit ${escAttr(u.id)}</span>
      <input class="title" data-field="title" value="${escAttr(u.title)}" placeholder="Unit title">
      <input class="meta" data-field="pages" value="${escAttr(u.pages)}" placeholder="Pages, e.g. SB : 4 to 12">
      <button class="remove" data-action="remove">✕ Remove unit</button>
    `;
    bar.querySelector('[data-field="title"]').addEventListener("input", e => u.title = e.target.value);
    bar.querySelector('[data-field="pages"]').addEventListener("input", e => u.pages = e.target.value);
    bar.querySelector('[data-action="remove"]').addEventListener("click", () => {
      g.units.splice(ui, 1);
      renderUnitsCA(g);
    });

    const table = document.createElement("table");
    table.className = "analysis";
    const thead = document.createElement("tr");
    CA_COLUMNS.forEach(c => {
      const th = document.createElement("th");
      th.textContent = c.label;
      thead.appendChild(th);
    });
    table.appendChild(thead);

    const row = document.createElement("tr");
    CA_COLUMNS.forEach(c => {
      const td = document.createElement("td");
      const ta = document.createElement("textarea");
      ta.value = u[c.key] || "";
      ta.addEventListener("input", () => { u[c.key] = ta.value; autosize(ta); });
      td.appendChild(ta);
      row.appendChild(td);
    });
    table.appendChild(row);

    card.appendChild(bar);
    card.appendChild(table);
    unitsContainer.appendChild(card);
  });
  unitsContainer.querySelectorAll("table.analysis textarea").forEach(autosize);
}

/* ---------- Term Plan unit rendering ----------
   Renders the exact same table shape as the original "Semester Plan"
   files: Reflection | Related Activities | Assessment (Tool / Strategy)
   | Instructional Strategies | Material/Resources | Outcomes | No.
   The six template cells (Reflection…Resources) are shared per grade —
   editing any copy of one updates every other unit's copy live. */
function renderUnitsTP(g){
  unitsContainer.innerHTML = "";
  g.units.forEach((u, ui) => {
    const card = document.createElement("div");
    card.className = "unit-card";

    const bar = document.createElement("div");
    bar.className = "unit-bar";
    bar.innerHTML = `
      <span class="tag">Unit ${escAttr(u.id)}</span>
      <input class="title" data-field="title" value="${escAttr(u.title)}" placeholder="Unit title">
      <input class="meta" data-field="duration" value="${escAttr(u.duration)}" placeholder="Duration">
      <input class="meta" data-field="pagesSB" value="${escAttr(u.pagesSB)}" placeholder="Pages SB">
      <input class="meta" data-field="pagesAB" value="${escAttr(u.pagesAB)}" placeholder="Pages AB">
      <input class="meta" style="width:96px" data-field="noClasses" value="${escAttr(u.noClasses)}" placeholder="No. of classes">
      <button class="remove" data-action="remove">✕ Remove unit</button>
    `;
    ["title","duration","pagesSB","pagesAB","noClasses"].forEach(f => {
      bar.querySelector(`[data-field="${f}"]`).addEventListener("input", e => u[f] = e.target.value);
    });
    bar.querySelector('[data-action="remove"]').addEventListener("click", () => {
      g.units.splice(ui, 1);
      renderUnitsTP(g);
    });

    const table = document.createElement("table");
    table.className = "analysis tp-table";
    table.innerHTML = `
      <tr>
        <th>No.</th>
        <th>Outcomes</th>
        <th>Material / Resources</th>
        <th>Instructional Strategies</th>
        <th colspan="2">Assessment</th>
        <th>Related Activities</th>
        <th>Reflection</th>
      </tr>
      <tr>
        <td rowspan="2"><textarea data-unit="sessionNumbers"></textarea></td>
        <td rowspan="2"><textarea data-unit="outcomes"></textarea></td>
        <td rowspan="2"><textarea data-tpl="resources"></textarea></td>
        <td rowspan="2"><textarea data-tpl="instructional"></textarea></td>
        <td class="tp-subhead">Strategy</td>
        <td class="tp-subhead">Tool</td>
        <td rowspan="2"><textarea data-tpl="activities"></textarea></td>
        <td rowspan="2"><textarea data-tpl="reflection"></textarea></td>
      </tr>
      <tr>
        <td><textarea data-tpl="strategy"></textarea></td>
        <td><textarea data-tpl="tool"></textarea></td>
      </tr>
    `;

    table.querySelectorAll("textarea[data-tpl]").forEach(ta => {
      const key = ta.dataset.tpl;
      ta.value = g.template[key] || "";
      ta.addEventListener("input", () => {
        g.template[key] = ta.value;
        table2querySelectorAllSync(key, ta.value);
        autosize(ta);
      });
    });
    table.querySelectorAll("textarea[data-unit]").forEach(ta => {
      const key = ta.dataset.unit;
      ta.value = u[key] || "";
      ta.addEventListener("input", () => { u[key] = ta.value; autosize(ta); });
    });

    const wrap = document.createElement("div");
    wrap.className = "tp-table-wrap";
    wrap.appendChild(table);

    card.appendChild(bar);
    card.appendChild(wrap);
    unitsContainer.appendChild(card);
  });

  function table2querySelectorAllSync(key, value){
    unitsContainer.querySelectorAll(`textarea[data-tpl="${key}"]`).forEach(other => {
      if(document.activeElement !== other) other.value = value;
    });
  }

  unitsContainer.querySelectorAll("table.tp-table textarea").forEach(autosize);
}

function renderUnits(){
  const g = state[mode][activeGrade[mode]];
  if(mode === "ca") renderUnitsCA(g); else renderUnitsTP(g);

function renderAll(){
  renderModeNav();

  hintText.textContent = mode === "ca"

/* =======================================================================
   WORD (.doc) EXPORT — works fully offline, no external libraries.
   Produces a real, fully editable Word document (table formatting,
   fonts, etc. all intact) using Word's own HTML import format.
   ======================================================================= */
function wrapWordDocument(bodyHtml, title){
  return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head>
<meta charset="utf-8">
<title>${escHtml(title)}</title>
<!--[if gte mso 9]>
<xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/></w:WordDocument></xml>
<![endif]-->
<style>
  @page { size:842.4pt 595.3pt; mso-page-orientation:landscape; margin:1in 0.5in 1in 0.5in; }
  body { font-family:Calibri, Arial, sans-serif; }
  table { border-collapse:collapse; }
  td, th { border:1px solid #444; padding:6px; }
</style>
</head>
<body>${bodyHtml}</body>
</html>`;
}

function downloadDoc(html, filename){
  const blob = new Blob(['\ufeff', html], { type: "application/msword" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------- Toast ---------- */
let toastTimer;
function showToast(msg){

  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ---------- Deep-link support (from the cover page) ----------
   Hash formats: #ca, #tp, #ca-3, #tp-6 (module + optional grade 1-6) */
function applyHash(){
  const h = location.hash.replace("#", "");
  if(!h) return;
  const [m, gradeNum] = h.split("-");
  if(m === "ca" || m === "tp") mode = m;
  if(gradeNum){
    const idx = parseInt(gradeNum, 10) - 1;
    if(idx >= 0 && idx < state[mode].length) activeGrade[mode] = idx;
  }
}

applyHash();
renderAll();
window.addEventListener("hashchange", () => { applyHash(); renderAll(); });

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
}
</script>
</body>
