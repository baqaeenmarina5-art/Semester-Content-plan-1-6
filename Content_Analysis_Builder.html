<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Content Analysis Builder — Grades 1–6</title>
<style>
  :root{
    --navy:#1c3a5e;
    --navy-deep:#12283f;
    --slate:#3f5872;
    --paper:#f7f5f0;
    --card:#ffffff;
    --line:#d9d3c4;
    --accent:#b5651d;
    --accent-soft:#f1e3d3;
    --ink:#20242a;
    --muted:#6b7280;
    --good:#2f6d4f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: "Iowan Old Style","Palatino Linotype", Georgia, serif;
    background:var(--paper);
    color:var(--ink);
  }
  .topbar{
    background:var(--navy-deep);
    color:#f2ede2;
    padding:22px 28px 20px;
    border-bottom:4px solid var(--accent);
  }
  .topbar h1{
    margin:0 0 4px;
    font-size:1.55rem;
    font-weight:600;
    letter-spacing:.01em;
  }
  .topbar p{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size:.85rem;
    color:#c9d2de;
  }
  .layout{
    display:flex;
    min-height:calc(100vh - 92px);
  }
  nav.grades{
    width:150px;
    flex:0 0 150px;
    background:var(--navy);
    padding:18px 0;
  }
  nav.grades button{
    display:block;
    width:100%;
    text-align:left;
    padding:12px 20px;
    background:none;
    border:none;
    border-left:4px solid transparent;
    color:#dbe4f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size:.92rem;
    cursor:pointer;
    transition:background .15s;
  }
  nav.grades button:hover{ background:rgba(255,255,255,.08); }
  nav.grades button.active{
    background:var(--paper);
    color:var(--navy-deep);
    font-weight:700;
    border-left:4px solid var(--accent);
  }
  main{
    flex:1;
    padding:26px 34px 60px;
    max-width:1180px;
  }
  .grade-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
    margin-bottom:18px;
    padding-bottom:14px;
    border-bottom:2px solid var(--line);
  }
  .grade-fields{
    display:flex;
    gap:22px;
    flex-wrap:wrap;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .field label{
    font-size:.68rem;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--muted);
  }
  .field input{
    font-family: inherit;
    font-size:.95rem;
    border:1px solid var(--line);
    border-radius:4px;
    padding:6px 8px;
    background:var(--card);
    color:var(--ink);
    min-width:150px;
  }
  .field input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  button.btn{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size:.83rem;
    font-weight:600;
    padding:9px 14px;
    border-radius:5px;
    border:1px solid var(--navy);
    background:var(--navy);
    color:#fff;
    cursor:pointer;
  }
  button.btn.secondary{
    background:var(--card);
    color:var(--navy);
  }
  button.btn.ghost{
    background:transparent;
    color:var(--slate);
    border-color:var(--line);
  }
  button.btn:hover{ opacity:.88; }
  .unit-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    margin-bottom:22px;
    overflow:hidden;
  }
  .unit-bar{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    background:var(--accent-soft);
    padding:10px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }
  .unit-bar .tag{
    font-weight:700;
    color:var(--accent);
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.05em;
  }
  .unit-bar input.title{
    flex:1 1 260px;
    font-family: inherit;
    font-size:.95rem;
    font-weight:600;
    border:1px solid transparent;
    background:transparent;
    padding:5px 6px;
    border-radius:4px;
    color:var(--ink);
  }
  .unit-bar input.title:focus{ background:#fff; border-color:var(--line); outline:none; }
  .unit-bar input.pages{
    width:150px;
    font-family: inherit;
    font-size:.82rem;
    border:1px solid var(--line);
    background:#fff;
    padding:5px 7px;
    border-radius:4px;
    color:var(--slate);
  }
  .unit-bar button.remove{
    background:none;
    border:none;
    color:#a44;
    cursor:pointer;
    font-size:.78rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }
  table.analysis{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
  }
  table.analysis th{
    background:#eef1f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size:.72rem;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--slate);
    text-align:left;
    padding:8px 10px;
    border:1px solid var(--line);
  }
  table.analysis td{
    border:1px solid var(--line);
    vertical-align:top;
    padding:0;
  }
  table.analysis textarea{
    width:100%;
    min-height:100px;
    border:none;
    resize:vertical;
    padding:9px 10px;
    font-family: "Iowan Old Style", Georgia, serif;
    font-size:.87rem;
    line-height:1.4;
    color:var(--ink);
    background:transparent;
  }
  table.analysis textarea:focus{ outline:2px solid var(--accent); outline-offset:-2px; background:#fffdf8; }
  .toolbar-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:6px;
    flex-wrap:wrap;
    gap:10px;
  }
  .hint{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size:.78rem;
    color:var(--muted);
  }
  .toast{
    position:fixed;
    bottom:22px;
    right:22px;
    background:var(--good);
    color:#fff;
    padding:10px 16px;
    border-radius:6px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size:.85rem;
    box-shadow:0 4px 14px rgba(0,0,0,.2);
    opacity:0;
    transform:translateY(8px);
    transition:opacity .2s, transform .2s;
    pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateY(0); }
  @media (max-width:760px){
    .layout{ flex-direction:column; }
    nav.grades{ width:100%; flex:none; display:flex; overflow-x:auto; padding:8px; }
    nav.grades button{ border-left:none; border-bottom:3px solid transparent; white-space:nowrap; }
    nav.grades button.active{ border-bottom-color:var(--accent); }
    main{ padding:18px; }
  }
</style>
</head>
<body>

<div class="topbar">

    </div>

    <div id="unitsContainer"></div>

    <div class="toolbar-bottom">
      <button class="btn ghost" id="addUnitBtn">+ Add unit</button>
      <div class="actions">

        <button class="btn secondary" id="downloadAllBtn">Download all 6 grades (.doc)</button>

    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

    pronunciation:"/aɪ/ — prize, bike, ride, bedtime, light, goodnight",

    structures:"Comparatives and superlatives — short adjectives: A mountain is higher than a hill. This is the deepest lake in the UK.\nComparatives and superlatives — long adjectives: Swimming is more exciting than walking. Amman is the most exciting city in the world.",
    vocabulary:"- Landscapes: city, forest, hill, island, lake, mountain, river, town, waterfall\n- Adjectives: beautiful, boring, colourful, dangerous, deep, delicious, difficult, exciting, high, interesting, wide",

    pronunciation:"\"er\" versus the schwa sound: Shall we have dinner? The food is interesting.",
    attitudes:"- Appreciation of culture\n- Responsibility\n- Respect for diversity: listening to stories and dialogues from different functions promotes openness to varied social and cultural contexts",

];

const COLUMNS = [
  {key:"pronunciation", label:"Pronunciation"},
  {key:"attitudes",     label:"Attitudes & Values"},
  {key:"functions",     label:"Functions"},
  {key:"structures",    label:"Structures"},
  {key:"vocabulary",    label:"Vocabulary, Terms & Expressions"},
  {key:"topics",        label:"Topics & Themes"}
];

/* deep clone so "reset" always has a clean original to fall back on */
let state = JSON.parse(JSON.stringify(ORIGINAL_DATA));
let activeGrade = 0;

/* ---------- Rendering ---------- */
const gradeNav = document.getElementById("gradeNav");
const gradeFields = document.getElementById("gradeFields");
const unitsContainer = document.getElementById("unitsContainer");

function renderNav(){
  gradeNav.innerHTML = "";
  state.forEach((g, i) => {
    const b = document.createElement("button");
    b.textContent = g.level.replace(/(st|nd|rd|th)/, "") + " grade";
    b.className = i === activeGrade ? "active" : "";
    b.onclick = () => { activeGrade = i; renderAll(); };
    gradeNav.appendChild(b);
  });
}

function renderGradeFields(){
  const g = state[activeGrade];
  gradeFields.innerHTML = `
    <div class="field"><label>Subject</label><input data-bind="subject" value="${escAttr(g.subject)}"></div>
    <div class="field"><label>Class / Level</label><input data-bind="level" value="${escAttr(g.level)}"></div>
    <div class="field"><label>Semester</label><input data-bind="semester" value="${escAttr(g.semester)}"></div>
  `;
  gradeFields.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("input", () => {
      g[inp.dataset.bind] = inp.value;
      if(inp.dataset.bind === "level") renderNav();
    });
  });
}

function renderUnits(){
  const g = state[activeGrade];
  unitsContainer.innerHTML = "";
  g.units.forEach((u, ui) => {
    const card = document.createElement("div");
    card.className = "unit-card";

    const bar = document.createElement("div");
    bar.className = "unit-bar";
    bar.innerHTML = `
      <span class="tag">Unit ${escAttr(u.id)}</span>
      <input class="title" data-field="title" value="${escAttr(u.title)}" placeholder="Unit title">
      <input class="pages" data-field="pages" value="${escAttr(u.pages)}" placeholder="Pages, e.g. SB : 4 to 12">
      <button class="remove" data-action="remove">✕ Remove unit</button>
    `;
    bar.querySelector('[data-field="title"]').addEventListener("input", e => u.title = e.target.value);
    bar.querySelector('[data-field="pages"]').addEventListener("input", e => u.pages = e.target.value);
    bar.querySelector('[data-action="remove"]').addEventListener("click", () => {
      g.units.splice(ui, 1);
      renderUnits();
    });

    const table = document.createElement("table");
    table.className = "analysis";
    const thead = document.createElement("tr");
    COLUMNS.forEach(c => {
      const th = document.createElement("th");
      th.textContent = c.label;
      thead.appendChild(th);
    });
    table.appendChild(thead);

    const row = document.createElement("tr");
    COLUMNS.forEach(c => {
      const td = document.createElement("td");
      const ta = document.createElement("textarea");
      ta.value = u[c.key] || "";
      ta.addEventListener("input", () => { u[c.key] = ta.value; autosize(ta); });
      td.appendChild(ta);
      row.appendChild(td);
    });
    table.appendChild(row);

    card.appendChild(bar);
    card.appendChild(table);
    unitsContainer.appendChild(card);
  });

  // size textareas after they're in the DOM
  unitsContainer.querySelectorAll("textarea").forEach(autosize);
}

function autosize(ta){
  ta.style.height = "auto";
  ta.style.height = Math.max(100, ta.scrollHeight + 2) + "px";
}

function renderAll(){
  renderNav();
  renderGradeFields();
  renderUnits();
}

function escAttr(s){
  return String(s || "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
}

/* ---------- Add unit ---------- */
document.getElementById("addUnitBtn").addEventListener("click", () => {
  const g = state[activeGrade];
  const nextNum = g.units.filter(u => /^\d+$/.test(u.id)).length + 1;
  g.units.push({
    id:String(nextNum), title:"New unit", pages:"SB : ",
    pronunciation:"", attitudes:"", functions:"", structures:"", vocabulary:"", topics:""
  });
  renderUnits();
});

/* ---------- Reset ---------- */
document.getElementById("resetGradeBtn").addEventListener("click", () => {
  state[activeGrade] = JSON.parse(JSON.stringify(ORIGINAL_DATA[activeGrade]));
  renderAll();
  showToast("Grade reset to the original file content.");
});

/* ---------- Word (.doc) export ---------- */
function escHtml(s){
  return String(s || "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\n/g,"<br>");
}

function gradeToWordBody(g){
  let html = `<h1 style="font-family:Calibri,Arial,sans-serif;">Content Analysis</h1>
  <h2 style="font-family:Calibri,Arial,sans-serif;">Subject: ${escHtml(g.subject)}</h2>`;
  g.units.forEach(u => {
    html += `<p style="font-family:Calibri,Arial,sans-serif;font-size:11pt;">
      Class/Level: ${escHtml(g.level)} &nbsp;&nbsp;&nbsp; ${escHtml(g.semester)} &nbsp;&nbsp;&nbsp;
      <b>Unit Title (${escHtml(u.id)}): ${escHtml(u.title)}</b> &nbsp;&nbsp;&nbsp; Pages ${escHtml(u.pages)}</p>`;
    html += `<table style="border-collapse:collapse;width:100%;" border="1" cellspacing="0" cellpadding="6">
      <tr>${COLUMNS.map(c => `<th style="background:#D9E2F3;font-family:Calibri,Arial,sans-serif;font-size:10pt;text-align:left;">${c.label}</th>`).join("")}</tr>
      <tr>${COLUMNS.map(c => `<td style="font-family:Calibri,Arial,sans-serif;font-size:10.5pt;vertical-align:top;">${escHtml(u[c.key])}</td>`).join("")}</tr>
    </table>
    <p style="font-family:Calibri,Arial,sans-serif;font-size:8pt;color:#666;">Form # QF71-1-49 rev. a</p>
    <br>`;
  });
  return html;
}

function wrapWordDocument(bodyHtml, title){
  return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head>
<meta charset="utf-8">
<title>${escHtml(title)}</title>
<!--[if gte mso 9]>
<xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/></w:WordDocument></xml>
<![endif]-->
<style>
  @page { size:842.4pt 595.3pt; mso-page-orientation:landscape; margin:1in 0.6in 1in 0.6in; }
  body { font-family:Calibri, Arial, sans-serif; }
  table { border-collapse:collapse; }
  td, th { border:1px solid #444; padding:6px; }
</style>
</head>
<body>${bodyHtml}</body>
</html>`;
}

function downloadDoc(html, filename){
  const blob = new Blob(['\ufeff', html], { type: "application/msword" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById("downloadGradeBtn").addEventListener("click", () => {
  const g = state[activeGrade];
  const body = gradeToWordBody(g);
  const title = `Content Analysis - Grade ${g.level}`;
  downloadDoc(wrapWordDocument(body, title), `Content_Analysis_Grade_${g.level.replace(/\D/g,"")}.doc`);
  showToast(`Downloaded Grade ${g.level} content analysis.`);
});

document.getElementById("downloadAllBtn").addEventListener("click", () => {
  let body = "";
  state.forEach((g, i) => {
    body += gradeToWordBody(g);
    if(i < state.length - 1){
      body += `<br clear="all" style="page-break-before:always">`;
    }
  });
  downloadDoc(wrapWordDocument(body, "Content Analysis - Grades 1-6"), "Content_Analysis_Grades_1-6.doc");
  showToast("Downloaded all 6 grades in one Word file.");
});

/* ---------- Toast ---------- */
let toastTimer;
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

renderAll();
</script>
</body>
</html>
